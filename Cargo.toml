[package]
name = "rescuemesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fault-tolerant incident coordination on a three-node Raft cloud"
publish = false

[dependencies]
# Consensus library. Pinned exactly: everything in src/raft/ is written against this version.
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "single-term-leader"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"

anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
await_holding_lock = "deny"

[profile.release]
debug = 1 # keep symbols for profiling experiment runs
