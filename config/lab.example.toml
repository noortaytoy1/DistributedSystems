# Three nodes on three lab machines. Copy to config/lab.toml and set the real addresses.
# Peer ports must be open between the node machines over TCP, and client ports from the client
# machines over both UDP (reports) and TCP (ctl). A big UDP buffer needs a sysctl on all six machines.
# `ctl status` says "udp no answer" if a rule is missing. Full steps: docs/runbook.md.
# Anything left out uses the defaults in src/config.rs.
#
# Listed 3, 2, 1 for the demo. A node's place here sets its election timeout (D115), so with node 3
# also started first, node 3 tends to lead, while an idle tie still goes to node 1. That keeps who
# leads and who wins a tie apart on screen (D165). It only tends to: read ctl status, never assume.
# The experiment runner builds its own list from experiments/hosts and never reads this file.

[[cluster.nodes]]
id = 3
peer_addr = "10.0.0.13:7001"
client_addr = "10.0.0.13:8001"

[[cluster.nodes]]
id = 2
peer_addr = "10.0.0.12:7001"
client_addr = "10.0.0.12:8001"

[[cluster.nodes]]
id = 1
peer_addr = "10.0.0.11:7001"
client_addr = "10.0.0.11:8001"

[timers]
# Every peer suspected this long, and a serving node answers without a commit (D121).
# One peer suspected this long leaves this node's group member list (D153).
degraded_after_ms = 2000

[policy]
assignment = "bidding"
# Used under "bidding" only.
# "expected-wait", "expected-wait-cpu", "queue-only" or "cpu-only"
score = "expected-wait"
# Score added per permille of CPU, under "expected-wait-cpu" only. A placeholder: set it from
# measured planning time before experiment E6.
cpu_weight = 10
# "off", "wins-only" or "won-and-leading"
just_won = "won-and-leading"
# Planning time a node assumes until its first job finishes. Low, so an untried node gets tried.
initial_service_us = 1
# A Raft leader whose load stays at least this many times its lowest peer's mean bid goes quiet, so that
# a normal vote picks another leader (D218). Its load is its own mean bid, or how long its log takes if
# that is slow. 0 turns it off. A new leader costs about 1 s with no commits.
leader_overload_ratio = 3
# How long that must hold without a break.
leader_overload_for_ms = 5000
# No step-aside until this long after the last term change. This is what stops a storm of elections.
leader_overload_cooldown_ms = 60000

[workers]
# The demo runs E1's values, because at the defaults idle nodes tie and node 1 plans every typed
# report (D205). The experiment runner builds its own config and never reads this file.
plan_work = 1000

[campus]
# E1's value (D205). With 30 responders about half of the demo's load would find nobody free.
responders = 300
# Simulated time on scene: a responder is held this long per point of severity (D111).
service_ms_per_severity = 200
# How long a report stays valid; a node refuses an older one and sends nobody (D143). Keep it above
# the client's retries, at most 36 s by default. Set it for one run with: loadgen --ttl-ms
incident_ttl_ms = 60000

[metrics]
dir = "runs/lab"

[storage]
# Raft log and vote on disk, so a node survives losing power (D118). Wipe it between experiment runs.
dir = "data/raft"

[faults]
# false: no injected faults at all (no fault election, ctl silence refused). Baseline runs.
# Override for one node with: node --faults on|off. One node with it off stops every election.
enabled = true
# Each node waits interval_min..max ms; the first to finish calls a fault election. All three draw
# a random number, and the highest goes silent for its own silence_min..max ms. A node missing any
# number does nothing. interval_min_ms must be >= silence_max_ms, or rounds cannot finish.
#
# Shipped so that no timer ever fires: in the demo only you cause faults, with ctl silence, and a
# missed hand edit cannot silence a node in the middle of a scene (D165). ctl silence still works.
interval_min_ms = 100000000
interval_max_ms = 100000000
silence_min_ms = 1000
silence_max_ms = 20000
# To let the nodes elect faults by themselves, replace the two interval lines, on all six machines:
# interval_min_ms = 30000
# interval_max_ms = 60000
# For the demo's timed last scene (D162), use these four instead:
# interval_min_ms = 20000
# interval_max_ms = 30000
# silence_min_ms = 20000
# silence_max_ms = 20000
# seed = 1   # repeats each node's numbers per round; unset picks a random seed and logs it
