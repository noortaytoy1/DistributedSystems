# run: users=1000 think_ms=1000

[policy]
assignment = "bidding"
score = "expected-wait"
cpu_weight = 1

[workers]
plan_work = 1000

[campus]
# 300 would cap assignments near 500 a second, and the top of E1 would measure the pool (D219).
responders = 3000

[faults]
# Faults only as the run line orders them: the schedule never fires within a run.
enabled = true
interval_min_ms = 100000000
interval_max_ms = 100000000
