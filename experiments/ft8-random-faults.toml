# run: users=300 think_ms=1000

[policy]
# A busy leader stays leader here, so runs stay comparable (D218).
leader_overload_ratio = 0
assignment = "bidding"
score = "expected-wait"
cpu_weight = 1

[workers]
plan_work = 1000

[campus]
responders = 300

[faults]
# Elected faults, one after another, over the whole run (FT-8, D158). No seed: a fixed one would
# repeat the same numbers per round in all three runs. A run cannot be replayed; its logs hold every
# number. About 2 elections per quick run, too few to say anything about how they are shared out.
enabled = true
interval_min_ms = 20000
interval_max_ms = 30000
