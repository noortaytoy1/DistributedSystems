# run: users=300 think_ms=1000

[timers]
bid_window_ms = 20

[policy]
assignment = "bidding"
score = "expected-wait"
cpu_weight = 1

[workers]
plan_work = 1000

[campus]
responders = 300

[faults]
# Faults only as the run line orders them: the schedule never fires within a run.
enabled = true
interval_min_ms = 100000000
interval_max_ms = 100000000
