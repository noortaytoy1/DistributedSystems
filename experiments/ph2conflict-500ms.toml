# run: users_per_pc=1000 think_ms=1000 pattern=random
# Responders claim on news this many ms old (D442, D446).

[policy]
# A busy leader stays leader here, so runs stay comparable (D218).
leader_overload_ratio = 0
assignment = "bidding"
score = "expected-wait"
cpu_weight = 1

[workers]
plan_work = 1000

[campus]
# As the top E1 cells, so the pool is not what the sweep measures (D219).
responders = 3000

[faults]
# Faults only as the run line orders them: the schedule never fires within a run.
enabled = true
interval_min_ms = 100000000
interval_max_ms = 100000000

[workload]
# The Phase 2 lifecycle: register, subscribe, report, discover, P2P, offer, claim, move zone (D430, D446).
lifecycle = true
claim_delay_ms = 500
